[ClassicExplorerThemeManifest]
ManifestVersion = 1 ; Version of ClassicExplorer theme manifest
Name = Windows 98/2000 Theme
Description = A theme matching the Windows 98 and Windows 2000 visual appearances.
Author = Isabella Lulamoon (kawapure)
Version = 1.0 ; Version of the theme itself

[Properties]
ThrobberBackground.Color="#000000"
EnableListViewWatermarks=false ; Watermarks did not exist before Windows XP.

[Files]
GoActive = Images\go_active.bmp
GoInactive = Images\go_inactive.bmp

ThrobberSmall = Images\throbber_s0.bmp
ThrobberMedium = Images\throbber_s1.bmp
ThrobberLarge = Images\throbber_s2.bmp